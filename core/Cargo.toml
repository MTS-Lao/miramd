[package]
name = "miramd-core"
version = "0.1.0"
edition = "2021"
description = "Shared Markdown engine for the MiraMD native desktop apps"
license = "MIT"

[lib]
name = "miramd_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
ammonia = "4.1"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
