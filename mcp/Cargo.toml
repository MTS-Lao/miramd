[package]
name = "miramd-mcp"
version = "0.1.0"
edition = "2021"
description = "Local Model Context Protocol server for MiraMD"
license = "MIT"

[[bin]]
name = "miramd-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
miramd-core = { path = "../core" }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
